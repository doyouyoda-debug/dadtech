<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Monster Opera — DadTech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.min.css">
  <style>
    body {
      background-image: url('./images/backgroundy.png');
      background-size: cover;
      background-attachment: fixed;
      background-repeat: no-repeat;
      background-position: center;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('./images/backgroundy.png');
      background-size: cover;
      background-attachment: fixed;
      background-repeat: no-repeat;
      background-position: center;
      filter: blur(8px);
      z-index: -1;
    }
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.4) 0%, rgba(0, 0, 0, 0.5) 50%, rgba(0, 0, 0, 0.4) 100%);
      z-index: -1;
    }
    .bomb-icon {
      width: 28px;
      height: 32px;
      background-image: url('./images/bomb.png');
      background-position: center;
      background-repeat: no-repeat;
      background-size: contain;
      image-rendering: auto;
      display: inline-block;
      margin-right: 32px;
    }
    .mousetrap-icon {
      width: 28px;
      height: 32px;
      background-image: url('./images/mousetrap.png');
      background-position: center;
      background-repeat: no-repeat;
      background-size: contain;
      image-rendering: auto;
      display: inline-block;
      margin-right: 32px;
    }
    .tramp-icon {
      width: 28px;
      height: 32px;
      background-image: url('./images/tramp.png');
      background-position: center;
      background-repeat: no-repeat;
      background-size: contain;
      image-rendering: auto;
      display: inline-block;
      margin-right: 32px;
    }
    .weapon-next {
      position: relative;
      display: inline-block;
    }
    .weapon-next::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60px;
      height: 60px;
      background-image: url('./images/shield.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      z-index: -1;
      pointer-events: none;
    }
    .weapon-next img {
      position: relative;
      z-index: 10;
      display: block;
    }
    #stats {
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 16px 24px;
      min-height: 70px;
      display: flex;
      align-items: center;
      border-radius: 12px;
    }
    body {
      font-family: 'Nunito', sans-serif;
    }
    /* Success stars animations */
    .success-star { display: inline-block; transform-origin: center; }
    @keyframes starPop {
      0% { transform: scale(0.3); opacity: 0; }
      60% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1.0); opacity: 1; }
    }
    @keyframes starTwinkle {
      0% { transform: translateY(0) scale(1.0); }
      50% { transform: translateY(-1px) scale(1.05); }
      100% { transform: translateY(0) scale(1.0); }
    }
      /* Success stars animations */
    .success-star { display: inline-block; transform-origin: center; }
    .success-star svg { filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)) brightness(1.1); }
    @keyframes starPop {
      0% { transform: scale(0.3); opacity: 0; }
      60% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1.0); opacity: 1; }
    }
    @keyframes starTwinkle {
      0% { transform: translateY(0) scale(1.0); }
      50% { transform: translateY(-1px) scale(1.05); }
      100% { transform: translateY(0) scale(1.0); }
    }
    /* Confetti */
    .confetti-piece { position: absolute; width: 8px; height: 14px; opacity: 0.95; border-radius: 2px; }
    @keyframes confettiBurst {
      0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
      100% { 
        transform: translate(var(--vx), var(--vy)) rotate(720deg) translateY(500px); 
        opacity: 0; 
      }
    }
    /* Success stats bounce */
    @keyframes statBounce {
      0% { transform: scale(0.5); opacity: 0; }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }
    .stat-bounce { animation: statBounce 600ms cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards; }
  </style>
</head>
<body class="p-8 bg-white bg-opacity-90 relative z-0">
  <main class="max-w-6xl mx-auto">
    <!-- Test Mode Toggle (hidden in top left) -->
    <div id="testModeToggle" style="position: fixed; top: 8px; left: 8px; width: 18px; height: 18px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 2px; cursor: pointer; z-index: 100; transition: all 0.3s; opacity: 0.5;" title="Test Mode (click to toggle)"></div>
    
    <div id="game" class="w-full max-w-5xl mx-auto">
      <div id="stats" class="flex justify-between items-center mb-2 text-lg font-bold text-white gap-4 flex-wrap">
        <span id="scoreText">Score: 0</span>
        <div class="flex items-center gap-8">
          <span id="statsText">Level: 1 | Bombs: 4</span>
          <div id="bombIcons" class="flex items-center gap-12"></div>
          <div id="weaponQueue" class="flex items-center gap-1 text-sm font-semibold text-white"></div>
        </div>
      </div>
      <div id="sky" class="relative h-[550px] rounded-lg overflow-hidden" style="box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);">
        <canvas id="skyCanvas" aria-hidden="true" class="absolute inset-0 w-full h-full block z-10 rounded-lg"></canvas>
        <div id="character" class="absolute top-4 left-1/2 w-20 h-24 bg-transparent -translate-x-1/2 z-20 pointer-events-none"></div>
      </div>
      <div id="hud" class="mt-4 flex gap-4 justify-center items-center">
        <button id="leftBtn" class="px-3 py-2 bg-gray-300 hover:bg-gray-400 rounded">◀</button>
        <button id="dropBtn" class="px-3 py-2 bg-gray-300 hover:bg-gray-400 rounded">Drop</button>
        <button id="rightBtn" class="px-3 py-2 bg-gray-300 hover:bg-gray-400 rounded">▶</button>
        <button id="retryBtn" class="cursor-pointer transition-transform hover:scale-105 border-0 p-0 bg-transparent" style="width: 250px; height: 100px; background-image: url('./images/retrybtn.png'); background-size: contain; background-repeat: no-repeat; background-position: center;"></button>
      </div>
      <div id="levelSelector" class="mt-6 flex flex-col items-center gap-2">
        <div class="flex items-center gap-2">
          <span class="font-semibold text-white">Act 1 : Castle Forrest</span>
          <button title="Reset stars" onclick="window.clearLevelStars()" class="flex items-center justify-center" style="width: 28px; height: 28px; border-radius: 6px; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25); color: #fff; font-weight: 800;">
            🗑
          </button>
        </div>
        <div id="levelButtons" class="flex gap-1 justify-center" style="flex-wrap: nowrap; width: 1440px;"></div>
      </div>
      
      <!-- Leaderboard Section -->
      <div id="leaderboardSection" class="max-w-4xl mx-auto" style="margin-top: 96px;">
        <h2 class="text-3xl font-bold text-center text-white mb-4" style="text-shadow: 0 2px 6px rgba(0,0,0,0.7);">Act 1: Castle Forrest Leaderboard</h2>
        <div class="bg-black/60 rounded-xl p-6 backdrop-blur-sm border border-white/20">
          <table class="w-full text-white">
            <thead>
              <tr class="border-b-2 border-yellow-500">
                <th class="py-3 px-4 text-center">Rank</th>
                <th class="py-3 px-4 text-left">Name</th>
                <th class="py-3 px-4 text-center">Score</th>
                <th class="py-3 px-4 text-center">Total Time</th>
                <th class="py-3 px-4 text-center">Weapons Left</th>
              </tr>
            </thead>
            <tbody id="leaderboardTableBody">
              <tr><td colspan="5" class="text-center text-gray-400 py-4">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      
      <div id="failureOverlay" class="fixed inset-0 bg-black/70 flex items-center justify-center z-50 hidden">
        <div class="relative flex flex-col items-center justify-center">
          <div class="absolute rounded-full opacity-80" style="width: 600px; height: 600px; background-color: black; top: -35px;"></div>
          <div id="failureModal" class="bg-cover bg-center w-96 h-80 relative z-10"
            style="background-image: url('./images/modal.png'); background-size: contain; background-repeat: no-repeat; background-position: center;">
          </div>
            <div class="relative z-10 mt-4 text-center px-8">
              <h2 class="text-3xl font-bold text-white mb-2 drop-shadow-md">Level Failed</h2>
              <p class="text-white text-base font-semibold drop-shadow">The actors are still standing!</p>
            </div>
          <button id="restartBtn" class="mt-6 cursor-pointer hover:opacity-80 transition-opacity relative z-10" style="background: none; border: none; padding: 0;">
            <img src="./images/retrybtn.png" alt="Restart Level" style="width: 260px; height: auto;">
          </button>
        </div>
      </div>
      <div id="successOverlay" class="fixed inset-0 bg-black/70 flex items-center justify-center z-50 hidden">
        <div class="relative flex flex-col items-center justify-center">
          <div class="absolute rounded-full opacity-80" style="width: 600px; height: 600px; background-color: black; top: -35px;"></div>
          <div id="successStars" class="flex items-center justify-center gap-3 mb-2 relative z-10"></div>
          <div id="successModal" class="bg-cover bg-center w-96 h-80 relative z-10"
               style="background-image: url('./images/successModal.png'); background-size: contain; background-repeat: no-repeat; background-position: center;">
          </div>
          <div class="flex items-center justify-between w-96 mt-4 px-8 relative z-10">
            <div class="text-center">
              <div class="text-sm font-semibold text-yellow-300">Time</div>
              <div id="successTime" class="text-2xl font-bold text-white">0.0s</div>
            </div>
            <div class="text-center">
              <div class="text-sm font-semibold text-yellow-300">Bombs Left</div>
              <div id="successBombs" class="text-2xl font-bold text-white">0</div>
            </div>
          </div>
          <button id="nextLevelBtn" class="mt-4 cursor-pointer hover:opacity-80 transition-opacity relative z-10" style="background: none; border: none; padding: 0;">
            <img src="./images/nextbtn.png" alt="Next Level" style="width: 300px; height: auto;">
          </button>
          <div id="confettiLayer" class="pointer-events-none absolute inset-0"></div>
        </div>
      </div>
      
      <!-- Leaderboard Prompt Overlay (shown after final level) -->
      <div id="leaderboardPromptOverlay" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 hidden">
        <div class="relative flex flex-col items-center justify-center">
          <div class="absolute rounded-full opacity-80" style="width: 600px; height: 600px; background-color: black; top: -35px;"></div>
          <div id="leaderboardPromptStars" class="flex items-center justify-center gap-3 mb-2 relative z-10"></div>
          <div class="bg-cover bg-center w-96 h-80 relative z-10 flex flex-col items-center justify-center"
               style="background-image: url('./images/successModal.png'); background-size: contain; background-repeat: no-repeat; background-position: center;">
            <h2 class="text-3xl font-bold text-white mb-4" style="text-shadow: 0 3px 8px rgba(0,0,0,0.8);">Game Complete!</h2>
          </div>
          
          <div class="relative z-10 mt-4 bg-black/70 rounded-xl p-6 backdrop-blur-sm border border-white/30 w-96">
            <div class="flex justify-between mb-4 text-white">
              <div class="text-center flex-1">
                <div class="text-sm font-semibold text-yellow-300">Total Score</div>
                <div id="finalScore" class="text-3xl font-bold text-white">0</div>
              </div>
              <div class="text-center flex-1">
                <div class="text-sm font-semibold text-yellow-300">Total Time</div>
                <div id="finalTime" class="text-xl font-bold text-white">0.0s</div>
              </div>
              <div class="text-center flex-1">
                <div class="text-sm font-semibold text-yellow-300">Weapons Left</div>
                <div id="finalWeapons" class="text-xl font-bold text-white">0</div>
              </div>
            </div>
            
            <div id="topTenMessage" class="text-center text-xl font-bold mb-4 text-yellow-400"></div>
            
            <div class="mb-4">
              <label for="playerNameInput" class="block text-white font-semibold mb-2">Enter Your Name:</label>
              <input 
                type="text" 
                id="playerNameInput" 
                maxlength="20" 
                placeholder="Your name here"
                class="w-full px-4 py-2 rounded-lg bg-white/90 text-gray-900 font-semibold focus:outline-none focus:ring-2 focus:ring-yellow-400"
              />
            </div>
            
            <div class="flex gap-3">
              <button 
                onclick="window.submitToLeaderboard()" 
                class="flex-1 bg-yellow-500 hover:bg-yellow-600 text-black font-bold py-3 px-6 rounded-lg transition-colors shadow-lg">
                Submit Score
              </button>
              <button 
                onclick="window.skipLeaderboard()" 
                class="flex-1 bg-gray-600 hover:bg-gray-700 text-white font-bold py-3 px-6 rounded-lg transition-colors">
                Skip
              </button>
            </div>
          </div>
          <div id="confettiLayer" class="pointer-events-none absolute inset-0"></div>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import init from './src/game.js';
    init();
  </script>
</body>
</html>
