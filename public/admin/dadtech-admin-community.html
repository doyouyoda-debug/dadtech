<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DadTech Admin | Community</title>
    <link rel="stylesheet" href="/dist/styles.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Audiowide&family=Poppins:wght@300;500;700&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: radial-gradient(circle at top, #160b35 0%, #03051a 100%);
            margin: 0;
            padding: 0;
            margin-left: 200px;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 200px;
            height: 100vh;
            background: linear-gradient(to bottom, #0f0620, #1a0f35);
            border-right: 2px solid rgba(59, 130, 246, 0.4);
            padding: 2rem 0;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .sidebar-title {
            color: #93c5fd;
            font-family: 'Audiowide', cursive;
            text-align: center;
            padding: 0 1rem;
            margin-bottom: 2rem;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            padding: 0 1rem;
            flex: 1;
        }

        .sidebar-btn {
            padding: 0.75rem;
            background: linear-gradient(to right, #3b82f6, #8b5cf6);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
            border-left: 3px solid transparent;
        }

        .sidebar-btn:hover {
            transform: translateX(5px);
            background: linear-gradient(to right, #60a5fa, #a78bfa);
        }

        .sidebar-btn.active {
            background: linear-gradient(to right, #6366f1, #a855f7);
            border-left-color: #fbbf24;
        }

        .sidebar-footer {
            padding: 1rem;
            border-top: 1px solid rgba(59, 130, 246, 0.3);
        }

        .sidebar-logout {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(to right, #ef4444, #dc2626);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .sidebar-logout:hover {
            transform: scale(1.05);
        }

        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin-left: -200px;
        }

        .card {
            background: linear-gradient(to bottom, #1e1b4b, #1e3a8a);
            border: 1px solid rgba(59, 130, 246, 0.4);
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-family: 'Audiowide', cursive;
            color: #93c5fd;
            text-align: center;
            margin-bottom: 0.5rem;
            font-size: 1.875rem;
        }

        .subtitle {
            color: #a5b4fc;
            text-align: center;
            margin-bottom: 2rem;
            font-size: 0.875rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            color: #93c5fd;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 0.5rem;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        input:focus {
            outline: none;
            border-color: #3b82f6;
        }

        button {
            padding: 0.75rem 1.5rem;
            background: linear-gradient(to right, #3b82f6, #8b5cf6);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }

        .status {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 0.5rem;
            text-align: center;
            font-size: 0.875rem;
        }

        .status.success {
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid rgba(34, 197, 94, 0.4);
            color: #86efac;
        }

        .status.error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
        }

        .header {
            background: linear-gradient(to right, #1e1b4b, #1e3a8a);
            border-bottom: 2px solid rgba(59, 130, 246, 0.4);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            text-align: left;
        }

        .header .subtitle {
            margin: 0;
            text-align: left;
            font-size: 0.75rem;
        }

        .logout-btn {
            background: linear-gradient(to right, #ef4444, #dc2626);
            padding: 0.5rem 1.5rem;
            width: auto;
            font-size: 0.875rem;
        }

        .dashboard-content {
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .stats-card {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(139, 92, 246, 0.1));
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            margin-bottom: 2rem;
            text-align: center;
        }

        .stats-card h3 {
            color: #93c5fd;
            font-size: 0.875rem;
            margin: 0 0 0.5rem 0;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-value {
            color: white;
            font-size: 2.5rem;
            font-weight: 700;
            margin: 0;
        }

        .dashboard-section {
            background: linear-gradient(to bottom, #1e1b4b, #1e3a8a);
            border: 1px solid rgba(59, 130, 246, 0.4);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .dashboard-section h2 {
            color: #93c5fd;
            font-size: 1.25rem;
            margin: 0 0 1rem 0;
            font-family: 'Audiowide', cursive;
        }

        .export-btn {
            background: linear-gradient(to right, #10b981, #059669);
            margin-bottom: 1rem;
            padding: 0.75rem 1.5rem;
        }

        .export-btn:hover {
            background: linear-gradient(to right, #34d399, #10b981);
        }

        .signups-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .signup-card {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(139, 92, 246, 0.1));
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s;
        }

        .signup-card:hover {
            transform: translateY(-5px);
        }

        .signup-card h3 {
            color: #93c5fd;
            margin: 0 0 0.5rem 0;
            word-break: break-word;
        }

        .signup-card p {
            margin: 0.5rem 0;
            color: #a5b4fc;
            font-size: 0.875rem;
            word-break: break-word;
        }

        .signup-label {
            color: #93c5fd;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: rgba(255, 255, 255, 0.5);
        }
    </style>

</head>
