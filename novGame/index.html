<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Canvas</title>
    <link rel="stylesheet" href="../dist/styles.css" />
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(to bottom, #ff8c42 0%, #ff6b35 25%, #8b4f9e 60%, #160b35 85%, #03051a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-family: 'Arial', sans-serif;
            position: relative;
        }

        .blurred-banner {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('../src/images/turtlebanner.png');
            background-size: contain;
            background-repeat: no-repeat;
            filter: blur(4px);
            opacity: 0.6;
            z-index: 0;
            pointer-events: none;
        }

        .banner-fade {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100vw;
            height: 200px;
            background: linear-gradient(to bottom, transparent, #160b35);
            z-index: 0;
            pointer-events: none;
        }

        .game-wrapper {
            position: relative;
            z-index: 1;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            position: relative;
            z-index: 1;
        }

        @media (max-width: 600px) {
            .game-container {
                width: 100%;
                padding: 0 8px;
            }
        }

        .heart {
            width: 40px;
            height: 40px;
            background-image: url('images/heart.png');
            background-size: cover;
            background-position: center;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
            transition: opacity 0.3s ease;
        }

        @media (max-width: 600px) {
            .heart {
                width: 24px;
                height: 24px;
            }
        }

        .heart.empty {
            opacity: 0.2;
        }

        .header-bar {
            border-radius: 15px 15px 0 0;
            border-bottom: none;
            width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 32px;
            margin-bottom: 8px;
        }

        @media (max-width: 600px) {
            .header-bar {
                width: calc(100% - 16px);
                flex-wrap: wrap;
                gap: 6px;
                padding: 6px 8px;
                justify-content: space-between;
                align-items: center;
            }

            .header-bar > div {
                flex: 0 1 auto;
                min-width: 0;
            }

            .header-bar .flex.items-center.gap-3.text-white\/90.font-bold.text-2xl {
                font-size: 12px !important;
                gap: 4px !important;
            }

            .header-bar .flex.items-center.gap-2 button {
                padding: 2px 6px !important;
                font-size: 10px !important;
            }
        }

        canvas {
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-top: none;
            border-radius: 0 0 15px 15px;
            display: block;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }

        @media (max-width: 600px) {
            canvas {
                width: 100% !important;
                height: auto !important;
                max-width: 100vw;
            }
        }

        /*
Source - https://stackoverflow.com/a
Posted by Tommy Bjerregaard, modified by community. See post 'Timeline' for change history
Retrieved 2025-11-09, License - CC BY-SA 3.0
*/

        #gameCanvas
{
    border-radius: 15px;

}

        /* Mobile Controls */
        .mobile-controls {
            display: none;
            flex-direction: row;
            gap: 8px;
            margin-top: 12px;
            width: 100%;
            max-width: 600px;
            justify-content: space-between;
            align-items: center;
        }

        @media (max-width: 600px) {
            .mobile-controls {
                display: flex;
            }
        }

        .mobile-center {
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
        }

        .mobile-btn {
            flex: 0 1 auto;
            min-width: 80px;
            max-width: 100px;
            padding: 12px 8px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        .mobile-btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        .mobile-btn.left {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .mobile-btn.right {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .mobile-btn.jump {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .mobile-btn.eat {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .scores-section {
            width: 1200px;
        }

        @media (max-width: 600px) {
            .scores-section {
                width: calc(100% - 16px);
                margin: 12px 8px !important;
            }
        }

        /* Title Screen Modal Responsive */
        #titleScreenModal {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            z-index: 50;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            width: 100vw !important;
            height: 100vh !important;
            margin: 0 !important;
            padding: 100px 0 0 0 !important;
        }

        #titleScreenModal > div:first-child {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            background-color: rgba(0, 0, 0, 0.8) !important;
            width: 100% !important;
            height: 100% !important;
            z-index: 5 !important;
        }

        #titleScreenModal .relative {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative !important;
            z-index: 51;
            padding: 20px;
        }

        #titleScreenModal img {
            max-width: 100%;
            max-height: 500px;
            width: auto;
            height: auto;
            margin-bottom: 16px;
        }

        #titleScreenModal button {
            padding: 12px 24px;
            font-size: 18px;
            z-index: 51 !important;
            position: relative;
        }

        @media (max-width: 600px) {
            #titleScreenModal {
                align-items: flex-start !important;
                padding-top: 20px !important;
            }

            #titleScreenModal .relative {
                align-items: center;
                padding: 12px;
            }

            #titleScreenModal img {
                max-width: 95vw !important;
                max-height: 30vh !important;
                height: auto !important;
            }

            #titleScreenModal button {
                padding: 10px 16px !important;
                font-size: 14px !important;
            }
        }
    </style>
<body>
    <!-- Background Music -->
    <audio id="backgroundMusic" loop>
        <source src="sounds/burgerRunTheme.mp3" type="audio/mpeg">
    </audio>
    <div class="blurred-banner"></div>
    <div class="banner-fade"></div>
    <div class="game-wrapper">
        <div class="game-container">
            <!-- Glassmorphic Header Bar -->
            <div class="header-bar rounded-xl border border-white/20 bg-white/10 backdrop-blur-xl shadow-lg">
            <!-- Music Controls -->
            <div class="flex items-center gap-2">
                <button id="musicPlayPauseBtn" class="px-3 py-1 rounded bg-white/20 hover:bg-white/30 text-white text-sm font-semibold transition-all" title="Pause/Play music">⏸</button>
                <button id="musicMuteBtn" class="px-3 py-1 rounded bg-white/20 hover:bg-white/30 text-white text-sm font-semibold transition-all" title="Mute/Unmute music">🔊</button>
            </div>

            <!-- Hearts Section -->
            <div class="flex items-center gap-4">
                <div class="flex gap-2" id="heartsContainer">
                    <!-- Hearts will be dynamically added here -->
                </div>
            </div>

            <!-- Time Section -->
            <div class="flex items-center gap-3 text-white/90 font-bold text-2xl">
                <span class="opacity-90">Time:</span>
                <span class="text-yellow-300" style="text-shadow: 0 0 10px rgba(255, 235, 59, 0.5);" id="timeValue">1:00</span>
            </div>

            <!-- Score Section -->
            <div class="flex items-center gap-3 text-white/90 font-bold text-2xl">
                <span class="opacity-90">Score:</span>
                <span class="text-yellow-300" style="text-shadow: 0 0 10px rgba(255, 235, 59, 0.5);" id="scoreValue">0</span>
            </div>
        </div>

            <!-- prickles is the name of the hedgehog character (Marie) -->
            <canvas id="gameCanvas" width="1200" height="650"></canvas>

            <!-- Mobile Controls (shown on screens < 600px) -->
            <div class="mobile-controls">
                <button id="mobLeftBtn" class="mobile-btn left">← LEFT</button>
                <div class="mobile-center">
                    <button id="mobJumpBtn" class="mobile-btn jump">JUMP ↑</button>
                    <button id="mobEatBtn" class="mobile-btn eat">EAT 👄</button>
                </div>
                <button id="mobRightBtn" class="mobile-btn right">RIGHT →</button>
            </div>

            <!-- Title Screen Modal -->
            <div id="titleScreenModal" class="absolute inset-0 z-50 flex items-center justify-center">
                <!-- Backdrop over canvas -->
                <div class="absolute inset-0 bg-black/80 rounded-2xl backdrop-blur-sm w-[80%] left-auto right-auto"></div>
                <!-- Dialog -->
                <div class="relative z-10 flex flex-col items-center">
                    <img src="images/titleScreen.png" alt="Game Title" class="max-w-[850px] max-h-[550px] object-contain rounded-xl shadow-2xl mb-4" />
                    <button id="startGameBtn" class="px-6 py-3 rounded-lg bg-green-500 hover:bg-green-600 text-white font-bold text-xl shadow-lg transition-all hover:scale-105">
                        Start Game
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Top Ten High Scores -->
    <div class="game-wrapper mt-6">
        <div class="game-container">
            <div class="scores-section rounded-xl border border-white/20 bg-white/10 backdrop-blur-xl shadow-lg text-white p-4">
                <div class="flex items-center justify-between mb-3">
                    <h2 class="text-xl font-semibold">Top 10 High Scores</h2>
                    <span class="text-xs text-white/70">updates live</span>
                </div>
                <div id="topScoresEmpty" class="text-white/80">No scores yet — be the first!</div>
                <ol id="topScoresList" class="list-decimal list-inside space-y-1 hidden"></ol>
            </div>
        </div>
    </div>

    <!-- Contributors Section -->
    <div class="game-wrapper mt-6 mb-6">
        <div class="game-container">
            <div class="scores-section rounded-xl border border-white/20 bg-white/10 backdrop-blur-xl shadow-lg text-white p-4">
                <div class="flex items-center justify-between mb-3">
                    <h2 class="text-xl font-semibold">Contributors</h2>
                    <span class="text-xs text-white/70">thank you!</span>
                </div>
                <div id="contributorsList" class="grid grid-cols-2 gap-2 text-white/90"></div>
            </div>
        </div>
    </div>

    <!-- High Score Modal -->
    <div id="highscoreModal" class="fixed inset-0 z-50 hidden items-center justify-center">
        <!-- Backdrop -->
        <div class="absolute inset-0 bg-black/60"></div>
        <!-- Dialog -->
        <div class="relative z-10 w-[90%] max-w-md rounded-2xl border border-white/20 bg-white/10 backdrop-blur-xl backdrop-saturate-150 shadow-2xl text-white p-6">
            <h3 class="text-2xl font-semibold mb-2">New High Score!</h3>
            <p class="text-indigo-100 mb-4">You made the top 10. Enter your name to save your score.</p>
            <div class="mb-4">
                <label for="hsNameInput" class="block text-sm text-indigo-200 mb-1">Player name</label>
                <input id="hsNameInput" type="text" maxlength="24" placeholder="Your name" class="w-full rounded-lg bg-white/20 border border-white/30 px-3 py-2 placeholder-white/60 focus:outline-none focus:ring-2 focus:ring-blue-400" />
            </div>
            <div class="mb-4">
                <span class="text-sm text-indigo-200">Your score:</span>
                <span id="hsScoreText" class="ml-2 text-yellow-300 font-bold text-xl">0</span>
            </div>
            <div id="hsMessage" class="text-sm text-green-300 mb-3 hidden">Saved!</div>
            <div class="flex gap-3 justify-end">
                <button id="hsCancelBtn" class="px-4 py-2 rounded-lg border border-white/30 bg-white/10 hover:bg-white/20">Cancel</button>
                <button id="hsSaveBtn" class="px-4 py-2 rounded-lg bg-blue-500 hover:bg-blue-600 text-white font-semibold">Save Score</button>
            </div>
        </div>
    </div>
    
    <script type="module">
        import Game from './src/Game.js';
        
        // Background music setup
        const backgroundMusic = document.getElementById('backgroundMusic');
        const playPauseBtn = document.getElementById('musicPlayPauseBtn');
        const muteBtn = document.getElementById('musicMuteBtn');
        
        // Set initial volume (quieter)
        backgroundMusic.volume = 0.3;
        
        // Play music on page load
        backgroundMusic.play().catch(err => console.log('Autoplay blocked:', err));
        
        // Play/Pause button
        playPauseBtn.addEventListener('click', () => {
            if (backgroundMusic.paused) {
                backgroundMusic.play();
                playPauseBtn.textContent = '⏸';
            } else {
                backgroundMusic.pause();
                playPauseBtn.textContent = '▶';
            }
        });
        
        // Mute button
        muteBtn.addEventListener('click', () => {
            if (backgroundMusic.muted) {
                backgroundMusic.muted = false;
                muteBtn.textContent = '🔊';
            } else {
                backgroundMusic.muted = true;
                muteBtn.textContent = '🔇';
            }
        });
        
        const canvas = document.getElementById('gameCanvas');
        const game = new Game(canvas);
        game.start();

        // Mobile controls setup (pointer-based, direct key control)
        const mobLeftBtn = document.getElementById('mobLeftBtn');
        const mobRightBtn = document.getElementById('mobRightBtn');
        const mobJumpBtn = document.getElementById('mobJumpBtn');
        const mobEatBtn = document.getElementById('mobEatBtn');

        // Helpers to press/release keys directly on the game state
        const press = (key) => {
            if (!game || !game.keys) return;
            if (key === 'left') {
                game.keys.left = true;
                game.keys.right = false; // prevent conflicting directions
            } else if (key === 'right') {
                game.keys.right = true;
                game.keys.left = false;
            } else if (key === 'up') {
                game.keys.up = true;
            } else if (key === 'x') {
                game.keys.x = true;
            }
        };

        const release = (key) => {
            if (!game || !game.keys) return;
            if (key === 'left') game.keys.left = false;
            else if (key === 'right') game.keys.right = false;
            else if (key === 'up') game.keys.up = false;
            else if (key === 'x') game.keys.x = false;
        };

        // Ensure all keys are released (safety net)
        const releaseAll = () => {
            if (!game || !game.keys) return;
            game.keys.left = false;
            game.keys.right = false;
            game.keys.up = false;
            game.keys.x = false;
        };

        // Bind pointer events for reliable press/release
        function bindControl(btn, key) {
            if (!btn) return;
            btn.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                try { btn.setPointerCapture && btn.setPointerCapture(e.pointerId); } catch {}
                press(key);
            }, { passive: false });

            const end = (e) => { e && e.preventDefault && e.preventDefault(); release(key); };
            btn.addEventListener('pointerup', end, { passive: false });
            btn.addEventListener('pointercancel', end, { passive: false });
            btn.addEventListener('pointerleave', end, { passive: false });
            btn.addEventListener('lostpointercapture', end, { passive: false });

            // Mouse fallback
            btn.addEventListener('mousedown', (e) => { e.preventDefault(); press(key); }, { passive: false });
            btn.addEventListener('mouseup', (e) => { e.preventDefault(); release(key); }, { passive: false });
            btn.addEventListener('mouseleave', (e) => { e.preventDefault(); release(key); }, { passive: false });
        }

        bindControl(mobLeftBtn, 'left');
        bindControl(mobRightBtn, 'right');
        bindControl(mobJumpBtn, 'up');
        bindControl(mobEatBtn, 'x');

        // Global safety: release keys when page is hidden or blurred
        window.addEventListener('blur', releaseAll);
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) releaseAll();
        });

        // Start Game button
        const startGameBtn = document.getElementById('startGameBtn');
        const titleScreenModal = document.getElementById('titleScreenModal');
        startGameBtn.addEventListener('click', () => {
            titleScreenModal.style.display = 'none';
        });
    </script>
</body>
</html>
